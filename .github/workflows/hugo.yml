name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow one concurrent deployment, queueing others and canceling in-progress ones
concurrency:
  group: pages
  cancel-in-progress: false

# Default to the minimum permissions required for the GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Don't deploy if the source branch is being used to publish somewhere else already
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build with Hugo
        # --minify 压缩 HTML/CSS/JS
        # --baseURL 强制使用你的线上域名，避免在 PR 预览里出现错误的 URL
        run: hugo --minify --baseURL "https://ernsky.github.io/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
