name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.146.0"
          extended: true

      - name: Debug theme presence
        run: |
          hugo version
          echo "---- git submodule status ----"
          git submodule status || true
          echo "---- themes dir ----"
          ls -la themes 2>&1 || true
          if [ -f themes/hugo-theme-next/theme.toml ]; then
            echo "::notice::THEME PRESENT at themes/hugo-theme-next"
          else
            echo "::error::THEME MISSING - themes/hugo-theme-next not found or incomplete"
            exit 1
          fi

      - name: Build with Hugo
        run: |
          set -o pipefail
          OUT=$(hugo --minify --baseURL "https://ernsky.github.io/" 2>&1)
          code=$?
          echo "$OUT"
          if [ $code -ne 0 ]; then
            OUT1=$(printf '%s' "$OUT" | tr '\n' ' ' | tr '\r' ' ')
            echo "::error::HUGO BUILD FAILED (exit $code): $OUT1"
            exit $code
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
