name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Debug theme presence
        run: |
          echo "Hugo version:"; hugo version
          if [ -f themes/diary/theme.toml ] || [ -f themes/diary/theme.yaml ]; then
            echo "THEME PRESENT at themes/diary"
          else
            echo "::error::THEME MISSING - themes/diary not found or incomplete"
            echo "---- themes dir ----"; ls -la themes 2>&1 || true
          fi

      - name: Build with Hugo
        run: |
          set -o pipefail
          OUT=$(hugo --minify --baseURL "https://ernsky.github.io/" 2>&1)
          code=$?
          echo "$OUT"
          if [ $code -ne 0 ]; then
            echo "::error::HUGO BUILD FAILED (exit $code): $OUT"
            exit $code
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
