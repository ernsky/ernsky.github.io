baseURL = "https://ernsky.github.io/"
languageCode = "zh-cn"
title = "Ernsky 的小站"
theme = "hugo-theme-next"

# 代码高亮（Hugo 内置 chroma，PaperMod 使用）
[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true
  [markup.goldmark.renderer]
    unsafe = true

[params]
  # 站点描述 / 关键词（用于 SEO 与分享卡片）
  description = "Ernsky 的个人博客，记录随笔与技术"
  keywords = ["Hugo", "PaperMod", "随笔", "技术"]
  author = "Ernsky"
  # 默认主题：auto 跟随系统，可选 dark / light
  defaultTheme = "auto"
  # 主页展示哪些栏目（普通博客模式，展示文章列表）
  mainSections = ["posts"]
  # 是否显示分享按钮
  enableShare = false

  # 左上角小标签（可选，不需要可删掉这一段）
  [params.label]
    text = "笔记"
    icon = "📝"

  # 社交链接（按需修改 / 删除）
  [[params.social]]
    name = "GitHub"
    icon = "github"
    url = "https://github.com/ernsky"
  [[params.social]]
    name = "Email"
    icon = "email"
    url = "mailto:ernsky@example.com"

# 顶部菜单
[[menu.main]]
  identifier = "archive"
  name = "归档"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 20
[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 30
[[menu.main]]
  identifier = "rss"
  name = "RSS"
  url = "/index.xml"
  weight = 40
