baseURL = "https://ernsky.github.io/"
defaultContentLanguage = "zh"
languageCode = "zh-cn"
title = "Ernsky 的小站"
copyright = "© 2026 Ernsky"
theme = "diary"
enableInlineShortcodes = true

# 站点地图
[sitemap]
  changefreq = "always"
  filename = "sitemap.xml"
  priority = 0.5

# Hugo 0.124+ 默认 chroma；diary 主题使用 monokai 风格
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    lineNos = false
    noClasses = true
    style = "monokai"
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[params]
  # 顶部副标题
  subtitle = "隻言片語・於此匯聚"

  # 侧栏信息
  keywords = ["Hugo", "随笔", "技术"]
  description = "Ernsky 的个人博客"

  # RSS 作者信息（供 index.rss.xml 使用）
  [params.author]
    name = "Ernsky"
    email = "ernsky@example.com"

  # 评论（先关掉，需要时再开）
  enableGitalk = false
  enableGiscus = false
  enableLiveRe = false
  enableWaline = false
  enableTwikoo = false

  # Open Graph / Twitter Card
  enableOpenGraph = true
  enableTwitterCards = true

[taxonomies]
  tag = "tags"
  category = "categories"

[[menu.main]]
  url = "/posts/"
  name = "归档"
  weight = 1

[[menu.main]]
  url = "/categories/"
  name = "分类"
  weight = 2

[[menu.main]]
  url = "/tags/"
  name = "标签"
  weight = 3

[[menu.main]]
  url = "/index.xml"
  name = "RSS"
  weight = 4
